<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Kawaiiss-sib 大家族族谱</title>
  <style>
    :root {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: #704b60;
      background: #fff3f8;
      --pink: #e99ab8;
      --deep-pink: #bd6f91;
      --soft-pink: #fff8fb;
      --lace: #f2c5d6;
    }

    * { box-sizing: border-box; }

    body {
      display: flex;
      flex-direction: column;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      overflow-x: hidden;
      overflow-y: auto;
      background:
        radial-gradient(ellipse at 10% 12%, #ffe1ed 0, transparent 26%),
        radial-gradient(ellipse at 92% 78%, #f9e3f2 0, transparent 28%),
        #fff8fb;
    }

    header {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex: none;
      padding: 13px 22px 18px;
      background: linear-gradient(110deg, #fffafd, #fff0f6 55%, #fffafd);
      border-bottom: 1px solid #f4d8e4;
      box-shadow: 0 4px 16px #b96c8812;
    }

    header::after {
      position: absolute;
      right: 0;
      bottom: -7px;
      left: 0;
      height: 14px;
      background: radial-gradient(circle at 7px 0, transparent 6px, #fff8fb 6.5px) 0 0 / 14px 14px repeat-x;
      content: "";
      pointer-events: none;
    }

    h1 {
      margin: 0;
      color: #a95278;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-shadow: 0 1px #fff, 0 2px 8px #eab3c966;
    }

    h1::before { content: "✦  "; color: #e7a5bf; }
    h1::after { content: "  ✦"; color: #e7a5bf; }

    .actions { display: flex; align-items: center; gap: 8px; }

    button, .download {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      border: 1px solid #edc4d4;
      border-radius: 999px;
      padding: 8px 12px;
      color: #925b74;
      background: linear-gradient(#fff, #fff7fa);
      font: inherit;
      font-size: 13px;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 2px 5px #bc769015, inset 0 1px #fff;
      transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }

    button:hover, .download:hover {
      transform: translateY(-1px);
      background: #fff0f6;
      box-shadow: 0 4px 10px #bc769028, inset 0 1px #fff;
    }
    button:disabled { cursor: wait; opacity: 0.65; }

    #status {
      color: #a4778c;
      font-size: 12px;
      white-space: nowrap;
    }

    #mobile-hint { display: none; }

    #album-shortcuts {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: none;
      overflow-x: auto;
      padding: 12px 18px;
      background:
        radial-gradient(circle, #f3c7d7 1px, transparent 1.5px) 0 0 / 12px 12px,
        linear-gradient(90deg, #fffafd, #fff4f8 50%, #fffafd);
      border-bottom: 1px dashed #e9bfd0;
      scrollbar-color: #e7b1c6 #fff3f8;
      scrollbar-width: thin;
    }

    #album-shortcuts h2 {
      flex: none;
      margin: 0;
      color: #a35f7d;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }

    #album-shortcuts h2::before { content: "♡ "; color: #dc8eac; }

    #album-shortcuts nav {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .album-shortcut {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex: none;
      min-height: 40px;
      padding: 3px 9px 3px 4px;
      border: 1px solid #f0c9d8;
      border-radius: 999px;
      color: #85566d;
      background: linear-gradient(145deg, #fff, #fff5f9);
      font-size: 12px;
      text-decoration: none;
      box-shadow: 0 2px 7px #b96c8818, inset 0 1px #fff;
      transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease;
    }

    .album-shortcut:hover {
      transform: translateY(-2px);
      border-color: #df9db7;
      background: #fff0f6;
      box-shadow: 0 5px 12px #b96c8830, inset 0 1px #fff;
    }

    .album-shortcut img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #fff;
      box-shadow: 0 0 0 1px #e7abc2, 0 1px 4px #a95f7a30;
    }

    main {
      flex: none;
      min-width: 0;
      width: 100%;
      padding: 0;
      background: linear-gradient(135deg, #fff0f6, #fdeaf2 48%, #fff6fa);
    }

    #viewer {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1940 / 1900;
      border: 0;
      border-radius: 0;
      background: #fff;
      box-shadow: 0 4px 18px #a95f7a18;
    }
    main:fullscreen { width: 100vw; height: 100vh; height: 100dvh; }
    main:fullscreen #viewer {
      width: 100%;
      height: 100%;
      aspect-ratio: auto;
      box-shadow: none;
    }

    #message {
      display: none;
      max-width: 680px;
      margin: 12vh auto;
      padding: 28px;
      border: 1px solid #efc6d6;
      border-radius: 20px;
      background: #fffafd;
      box-shadow: 0 8px 28px #a95f7a1a;
      line-height: 1.7;
    }

    #message h2 { margin-top: 0; color: #a95278; font-size: 18px; }
    #message p { color: #806879; }

    @media (max-width: 600px) {
      header {
        align-items: stretch;
        flex-direction: column;
        gap: 8px;
        padding: calc(9px + env(safe-area-inset-top)) 12px 15px;
      }

      h1 { font-size: 16px; }
      h1::before { content: "✧ "; }
      h1::after { content: " ✧"; }

      .actions {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto auto;
        gap: 7px;
      }

      #status {
        grid-column: 1 / -1;
        overflow: hidden;
        font-size: 11px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      button, .download {
        min-height: 44px;
        padding: 8px 10px;
        font-size: 12px;
      }

      #mobile-hint {
        display: block;
        margin: 0;
        padding: 7px 12px;
        color: #9c7085;
        background: #fff4f8;
        font-size: 12px;
        line-height: 1.4;
        text-align: center;
      }

      #album-shortcuts {
        gap: 8px;
        padding: 9px 10px;
      }

      #album-shortcuts nav { gap: 6px; }
      main { padding: 0; }
      #viewer { width: 100%; border-radius: 0; }

      body:has(main:fullscreen) header,
      body:has(main:fullscreen) #mobile-hint,
      body:has(main:fullscreen) #album-shortcuts { display: none; }
    }

    @media (max-width: 600px) and (orientation: landscape) {
      header { gap: 5px; padding-top: calc(5px + env(safe-area-inset-top)); padding-bottom: 5px; }
      .actions { grid-template-columns: minmax(0, 1fr) auto auto auto; }
      #status { grid-column: auto; }
      #mobile-hint { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Kawaiiss-sib 大家族族谱</h1>
    <div class="actions">
      <span id="status" role="status">正在连接族谱…</span>
      <button id="refresh" type="button">刷新</button>
      <button id="fullscreen" type="button" aria-label="全屏查看族谱">全屏</button>
      <a class="download" href="./Kawaiiss-sib-大家族族谱.drawio" download>下载 draw.io 文件</a>
    </div>
  </header>
  <p id="mobile-hint">上下滑动浏览族谱；可双指缩放</p>
  <section id="album-shortcuts" aria-label="现役种猫相册快捷入口">
    <h2>现役种猫 · 点击头像看相册</h2>
    <nav aria-label="现役种猫相册"></nav>
  </section>
  <main>
    <iframe id="viewer" title="Kawaiiss-sib 大家族族谱" allowfullscreen></iframe>
    <section id="message">
      <h2>这是族谱的在线查看页面</h2>
      <p>请将本 HTML 文件和 <strong>Kawaiiss-sib-大家族族谱.drawio</strong> 一起发布到网站的同一目录（例如 GitHub Pages）。页面会在打开或点击刷新时读取最新族谱。</p>
      <p>仅从电脑直接打开这个 HTML 文件时，浏览器会阻止它读取旁边的文件。发布到网站后，其他人就可以通过网页链接查看。</p>
    </section>
  </main>
  <script>
    (() => {
      const diagramPath = "./Kawaiiss-sib-大家族族谱.drawio";
      const status = document.getElementById("status");
      const viewer = document.getElementById("viewer");
      const message = document.getElementById("message");
      const refreshButton = document.getElementById("refresh");
      const fullscreenButton = document.getElementById("fullscreen");
      const albumNav = document.querySelector("#album-shortcuts nav");
      let previousVersion = "";
      let requestInProgress = false;
      let pendingDiagramXML = "";

      fetch("./albums.json", { cache: "no-store" })
        .then(response => {
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return response.json();
        })
        .then(albums => {
          Object.entries(albums)
            .filter(([, album]) => album.role.includes("现役"))
            .forEach(([id, album]) => {
              const link = document.createElement("a");
              link.className = "album-shortcut";
              link.href = `./album.html?cat=${encodeURIComponent(id)}`;
              link.setAttribute("aria-label", `打开${album.name}的相册`);

              const image = document.createElement("img");
              image.src = album.photos[0].src;
              image.alt = "";
              link.append(image, document.createTextNode(album.name));
              albumNav.append(link);
            });
        })
        .catch(error => {
          console.error("加载现役种猫相册入口失败", error);
          albumNav.textContent = "相册入口加载失败，请刷新页面";
        });

      if (location.protocol === "file:") {
        viewer.hidden = true;
        message.style.display = "block";
        status.textContent = "尚未发布到网站";
        refreshButton.disabled = true;
        fullscreenButton.disabled = true;
        return;
      }

      const diagramUrl = new URL(diagramPath, location.href);

      function getCellGeometry(cell, cellsById, visited = new Set()) {
        const id = cell.getAttribute("id");
        if (id && visited.has(id)) return null;
        if (id) visited.add(id);

        const geometry = Array.from(cell.children).find(child => child.localName === "mxGeometry");
        if (!geometry) return null;

        let x = Number(geometry.getAttribute("x")) || 0;
        let y = Number(geometry.getAttribute("y")) || 0;
        const parent = cellsById.get(cell.getAttribute("parent"));
        if (parent && parent.getAttribute("id") !== "1") {
          const parentGeometry = getCellGeometry(parent, cellsById, visited);
          if (parentGeometry) {
            x += parentGeometry.x;
            y += parentGeometry.y;
          }
        }

        return {
          x,
          y,
          width: Number(geometry.getAttribute("width")) || 0,
          height: Number(geometry.getAttribute("height")) || 0
        };
      }

      function addBirthdayCrowns(xml) {
        const diagram = new DOMParser().parseFromString(xml, "application/xml");
        if (diagram.querySelector("parsererror")) {
          throw new Error("族谱文件不是有效的 XML");
        }

        const graph = diagram.querySelector("mxGraphModel");
        const root = graph?.querySelector("root");
        if (!root) throw new Error("族谱文件中没有可显示的图表");

        const cells = Array.from(graph.getElementsByTagName("mxCell"));
        const cellsById = new Map(cells.map(cell => [cell.getAttribute("id"), cell]));
        const today = new Date();
        const todayKey = `${today.getMonth() + 1}/${today.getDate()}`;
        const datedCells = cells.filter(cell => {
          const birthday = cell.getAttribute("value")?.match(/(?:19|20)\d{2}\/(\d{1,2})\/(\d{1,2})/);
          return birthday && `${Number(birthday[1])}/${Number(birthday[2])}` === todayKey;
        });

        if (!datedCells.length) return { xml, names: [] };

        const images = cells.filter(cell => {
          if (cell.getAttribute("vertex") !== "1") return false;
          const style = cell.getAttribute("style") || "";
          return /(?:^|;)shape=image(?:;|$)/.test(style);
        }).map(cell => ({
          cell,
          geometry: getCellGeometry(cell, cellsById)
        })).filter(image => image.geometry);

        const names = [];
        for (const [index, cell] of datedCells.entries()) {
          const label = new DOMParser()
            .parseFromString(cell.getAttribute("value") || "", "text/html")
            .body.textContent.trim();
          const birthdayMatch = label.match(/((?:19|20)\d{2})\/(\d{1,2})\/(\d{1,2})/);
          const geometry = getCellGeometry(cell, cellsById);
          if (!birthdayMatch || !geometry) continue;

          const nearestImage = images
            .map(image => ({
              ...image,
              distance: Math.hypot(image.geometry.x - geometry.x, image.geometry.y - geometry.y)
            }))
            .sort((a, b) => a.distance - b.distance)[0];
          const hasNearbyImage = nearestImage && nearestImage.distance <= 24;
          const target = hasNearbyImage ? nearestImage.geometry : geometry;
          const crown = diagram.createElement("mxCell");
          crown.setAttribute("id", `birthday-crown-${index}-${cell.getAttribute("id") || "cat"}`);
          crown.setAttribute("parent", "1");
          crown.setAttribute("value", "👑");
          crown.setAttribute("vertex", "1");
          crown.setAttribute(
            "style",
            "text;html=1;align=center;verticalAlign=middle;whiteSpace=wrap;strokeColor=none;fillColor=none;fontSize=30;fontStyle=1;fontColor=#D49A28;"
          );

          const crownGeometry = diagram.createElement("mxGeometry");
          crownGeometry.setAttribute("x", String(target.x + (hasNearbyImage ? target.width / 2 - 18 : geometry.width / 2 - 18)));
          crownGeometry.setAttribute("y", String(target.y - 29));
          crownGeometry.setAttribute("width", "36");
          crownGeometry.setAttribute("height", "28");
          crownGeometry.setAttribute("as", "geometry");
          crown.append(crownGeometry);
          root.append(crown);

          const catName = label.slice(0, birthdayMatch.index).trim();
          if (catName) names.push(catName);
        }

        return {
          xml: new XMLSerializer().serializeToString(graph),
          names
        };
      }

      async function showDiagram(version) {
        const source = new URL(diagramUrl);
        #source.searchParams.set("_refresh", version || Date.now().toString());
        source.searchParams.set("_refresh", Date.now().toString());
        const response = await fetch(source, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const birthdayDiagram = addBirthdayCrowns(await response.text());

        if (birthdayDiagram.names.length) {
          pendingDiagramXML = birthdayDiagram.xml;
          const params = new URLSearchParams({
            embed: "1",
            proto: "json",
            spin: "1",
            noSaveBtn: "1",
            noExitBtn: "1",
            chrome: "0",
            ui: "min",
            refresh: Date.now().toString()
          });
          viewer.src = `https://embed.diagrams.net/?${params.toString()}`;
          status.textContent = `在线查看 · 今天是${birthdayDiagram.names.join("、")}的生日`;
          return;
        }

        pendingDiagramXML = "";
        const border = window.matchMedia("(max-width: 600px), (pointer: coarse)").matches
          ? "15"
          : "60";
        const params = new URLSearchParams({
          lightbox: "1",
          layers: "1",
          nav: "1",
          links: "1",
          border,
          url: source.href
        });
        viewer.src = `https://viewer.diagrams.net/?${params.toString()}`;
        status.textContent = "在线查看 · 打开或点击刷新时更新";
      }

      window.addEventListener("message", event => {
        if (event.origin !== "https://embed.diagrams.net" || event.source !== viewer.contentWindow) return;
        let data;
        try {
          data = typeof event.data === "string" ? JSON.parse(event.data) : event.data;
        } catch {
          return;
        }
        if (data?.event === "init" && pendingDiagramXML) {
          viewer.contentWindow.postMessage(
            JSON.stringify({ action: "load", xml: pendingDiagramXML }),
            event.origin
          );
        }
      });

      async function checkForUpdate(force = false) {
        if (requestInProgress) return;
        requestInProgress = true;
        refreshButton.disabled = true;
        try {
          const response = await fetch(diagramUrl, {
            method: "HEAD",
            cache: "no-store"
          });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const version = response.headers.get("etag")
            || response.headers.get("last-modified")
            || response.headers.get("content-length")
            || "available";
          if (force || version !== previousVersion) {
            previousVersion = version;
            await showDiagram(version);
          }
        } catch (error) {
          console.error("加载族谱失败", error);
          status.textContent = "暂时无法读取族谱文件；请确认 HTML 和 draw.io 文件已一起发布";
        } finally {
          requestInProgress = false;
          refreshButton.disabled = false;
        }
      }

      refreshButton.addEventListener("click", () => checkForUpdate(true));
      fullscreenButton.addEventListener("click", async () => {
        try {
          if (document.fullscreenElement) {
            await document.exitFullscreen();
          } else if (document.querySelector("main").requestFullscreen) {
            await document.querySelector("main").requestFullscreen();
          } else {
            status.textContent = "此浏览器不支持全屏；可横屏并双指缩放查看";
          }
        } catch {
          status.textContent = "无法进入全屏；可横屏并双指缩放查看";
        }
      });
      document.addEventListener("fullscreenchange", () => {
        fullscreenButton.textContent = document.fullscreenElement ? "退出全屏" : "全屏";
      });
      checkForUpdate(true);
    })();
  </script>
</body>
</html>

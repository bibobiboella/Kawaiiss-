<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Kawaiiss-sib 大家族族谱</title>
  <style>
    :root {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: #233044;
      background: #f4f7fb;
    }

    * { box-sizing: border-box; }

    body {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      margin: 0;
      overflow: hidden;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex: none;
      padding: 10px 20px;
      background: #fff;
      border-bottom: 1px solid #e5eaf1;
    }

    h1 { margin: 0; font-size: 18px; font-weight: 650; }

    .actions { display: flex; align-items: center; gap: 8px; }

    button, .download {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      border: 1px solid #d5deea;
      border-radius: 8px;
      padding: 8px 12px;
      color: #334155;
      background: #fff;
      font: inherit;
      font-size: 13px;
      text-decoration: none;
      cursor: pointer;
    }

    button:hover, .download:hover { background: #f7f9fc; }
    button:disabled { cursor: wait; opacity: 0.65; }

    #status {
      color: #64748b;
      font-size: 12px;
      white-space: nowrap;
    }

    #mobile-hint { display: none; }

    main {
      flex: 1;
      min-width: 0;
      min-height: 0;
      background: #fff;
    }

    #viewer { display: block; width: 100%; height: 100%; border: 0; background: #fff; }
    main:fullscreen { width: 100vw; height: 100vh; height: 100dvh; }

    #message {
      display: none;
      max-width: 680px;
      margin: 12vh auto;
      padding: 28px;
      border: 1px solid #e5eaf1;
      border-radius: 14px;
      background: #fff;
      line-height: 1.7;
    }

    #message h2 { margin-top: 0; font-size: 18px; }
    #message p { color: #526174; }

    @media (max-width: 600px) {
      header {
        align-items: stretch;
        flex-direction: column;
        gap: 8px;
        padding: calc(9px + env(safe-area-inset-top)) 12px 9px;
      }

      h1 { font-size: 16px; }

      .actions {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto auto;
        gap: 7px;
      }

      #status {
        grid-column: 1 / -1;
        overflow: hidden;
        font-size: 11px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      button, .download {
        min-height: 44px;
        padding: 8px 10px;
        font-size: 12px;
      }

      #mobile-hint {
        display: block;
        margin: 0;
        padding: 7px 12px;
        color: #526174;
        background: #f4f7fb;
        font-size: 12px;
        line-height: 1.4;
        text-align: center;
      }

      body:has(main:fullscreen) header,
      body:has(main:fullscreen) #mobile-hint { display: none; }
    }

    @media (max-width: 600px) and (orientation: landscape) {
      header { gap: 5px; padding-top: calc(5px + env(safe-area-inset-top)); padding-bottom: 5px; }
      .actions { grid-template-columns: minmax(0, 1fr) auto auto auto; }
      #status { grid-column: auto; }
      #mobile-hint { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Kawaiiss-sib 大家族族谱</h1>
    <div class="actions">
      <span id="status" role="status">正在连接族谱…</span>
      <button id="refresh" type="button">刷新</button>
      <button id="fullscreen" type="button" aria-label="全屏查看族谱">全屏</button>
      <a class="download" href="./Kawaiiss-sib-大家族族谱.drawio" download>下载 draw.io 文件</a>
    </div>
  </header>
  <p id="mobile-hint">建议横屏查看；在族谱中可双指缩放和拖动</p>
  <main>
    <iframe id="viewer" title="Kawaiiss-sib 大家族族谱" allowfullscreen></iframe>
    <section id="message">
      <h2>这是族谱的在线查看页面</h2>
      <p>请将本 HTML 文件和 <strong>Kawaiiss-sib-大家族族谱.drawio</strong> 一起发布到网站的同一目录（例如 GitHub Pages）。页面会在打开或点击刷新时读取最新族谱。</p>
      <p>仅从电脑直接打开这个 HTML 文件时，浏览器会阻止它读取旁边的文件。发布到网站后，其他人就可以通过网页链接查看。</p>
    </section>
  </main>
  <script>
    (() => {
      const diagramPath = "./Kawaiiss-sib-大家族族谱.drawio";
      const status = document.getElementById("status");
      const viewer = document.getElementById("viewer");
      const message = document.getElementById("message");
      const refreshButton = document.getElementById("refresh");
      const fullscreenButton = document.getElementById("fullscreen");
      let previousVersion = "";
      let requestInProgress = false;
      const viewerOrigin = "https://embed.diagrams.net";

      if (location.protocol === "file:") {
        viewer.hidden = true;
        message.style.display = "block";
        status.textContent = "尚未发布到网站";
        refreshButton.disabled = true;
        fullscreenButton.disabled = true;
        return;
      }

      const diagramUrl = new URL(diagramPath, location.href);

      async function loadDiagramIntoViewer() {
        const response = await fetch(diagramUrl, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const documentXml = new DOMParser().parseFromString(await response.text(), "application/xml");
        const graphModel = documentXml.querySelector("mxGraphModel");
        if (!graphModel) throw new Error("族谱文件缺少 mxGraphModel");
        viewer.contentWindow.postMessage(JSON.stringify({
          action: "load",
          xml: new XMLSerializer().serializeToString(graphModel)
        }), viewerOrigin);
      }

      window.addEventListener("message", event => {
        if (event.origin !== viewerOrigin || event.source !== viewer.contentWindow) return;
        let data;
        try {
          data = typeof event.data === "string" ? JSON.parse(event.data) : event.data;
        } catch {
          return;
        }

        if (data.event === "init") {
          loadDiagramIntoViewer().catch(() => {
            status.textContent = "无法加载族谱文件，请点击刷新重试";
          });
        } else if (data.event === "openLink" && typeof data.link === "string") {
          const target = new URL(data.link, location.href);
          if (target.origin === location.origin && target.pathname.endsWith("/album.html")) {
            location.assign(target.href);
          }
        }
      });

      function showDiagram(version) {
        const params = new URLSearchParams({
          embed: "1",
          proto: "json",
          spin: "1",
          ui: "min",
          noSaveBtn: "1",
          noExitBtn: "1",
          suppressNewWindows: "1"
        });
        viewer.src = `${viewerOrigin}/?${params.toString()}`;
        status.textContent = "在线查看 · 打开或点击刷新时更新";
      }

      async function checkForUpdate(force = false) {
        if (requestInProgress) return;
        requestInProgress = true;
        refreshButton.disabled = true;
        try {
          const response = await fetch(diagramUrl, {
            method: "HEAD",
            cache: "no-store"
          });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const version = response.headers.get("etag")
            || response.headers.get("last-modified")
            || response.headers.get("content-length")
            || "available";
          if (force || version !== previousVersion) {
            previousVersion = version;
            showDiagram(version);
          }
        } catch {
          status.textContent = "暂时无法读取族谱文件；请确认 HTML 和 draw.io 文件已一起发布";
        } finally {
          requestInProgress = false;
          refreshButton.disabled = false;
        }
      }

      refreshButton.addEventListener("click", () => checkForUpdate(true));
      fullscreenButton.addEventListener("click", async () => {
        try {
          if (document.fullscreenElement) {
            await document.exitFullscreen();
          } else if (document.querySelector("main").requestFullscreen) {
            await document.querySelector("main").requestFullscreen();
          } else {
            status.textContent = "此浏览器不支持全屏；可横屏并双指缩放查看";
          }
        } catch {
          status.textContent = "无法进入全屏；可横屏并双指缩放查看";
        }
      });
      document.addEventListener("fullscreenchange", () => {
        fullscreenButton.textContent = document.fullscreenElement ? "退出全屏" : "全屏";
      });
      checkForUpdate(true);
    })();
  </script>
</body>
</html>
